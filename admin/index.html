<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Felica Gate Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Felica Gate — Admin Panel</h1>
      <p>システム管理ダッシュボード</p>
    </header>

    <div class="dashboard-grid">
      <section class="card">
        <div class="card-header">
          <h2>👥 ユーザー管理</h2>
          <div class="card-actions">
            <button id="createUser" class="btn btn-primary">新規作成</button>
            <button id="refreshUsers" class="btn btn-secondary">更新</button>
          </div>
        </div>
        <div id="users" class="card-content"></div>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>🚆 履歴管理</h2>
          <div class="card-actions">
            <button id="createTrip" class="btn btn-primary">新規作成</button>
            <button id="refreshTrips" class="btn btn-secondary">更新</button>
          </div>
        </div>
        <div id="trips" class="card-content"></div>
      <section class="card">
        <div class="card-header">
          <h2>💳 カード管理</h2>
          <div class="card-actions">
            <button id="createCard" class="btn btn-primary">新規作成</button>
            <button id="refreshCards" class="btn btn-secondary">更新</button>
          </div>
        </div>
        <div id="cards" class="card-content"></div>
      </section>
    </div>
  </div>

  <script src="api.js"></script>
</body>
</html>
